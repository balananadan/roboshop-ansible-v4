- name: Download prometheus exporter
  ansible.builtin.shell: |
    cd /opt
    curl -L -O https://github.com/prometheus/node_exporter/releases/download/v1.11.1/node_exporter-1.11.1.linux-amd64.tar.gz
    tar -xf node_exporter-1.11.1.linux-amd64.tar.gz
    mv node_exporter-1.11.1.linux-amd64 node_exporter
    rm -f node_exporter-1.11.1.linux-amd64.tar.gz

- name: Create prometheus service file
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=node_exporter
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=simple
      ExecStart=/opt/node_exporter/node_exporter --collector.systemd

      [Install]
      WantedBy=multi-user.target

- name: Start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: restarted
    enabled: yes


